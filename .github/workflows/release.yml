name: Release

# Si avvia quando manifest.json cambia su main (cioè quando c'è una nuova versione):
# crea la release con i file che BRAT scarica (main.js, manifest.json, styles.css).
# Se la release di quella versione esiste già, non fa nulla.
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crea la release se non esiste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(jq -r .version manifest.json)
          if gh release view "$v" >/dev/null 2>&1; then
            echo "La release $v esiste già"
            exit 0
          fi
          gh release create "$v" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "$v" --generate-notes
